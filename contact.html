    <h1>Contact</h1>
    <p>Here you can input anything to let me know— if you just wanna say 'Hi!' or if you have any suggestions for the website, you can tell me below.</p>
    <form name="myForm" class="message-board">
        <h2>Thoughts? Feelings?</h2>
        <label for="name">Name</label>
        <input type="text" id="name" name="name">
        <label for="email">Email</label>
        <input type="email" id="email" name="email">
        <label for="message">Message</label>
        <input type="text" id="message" name="message" rows="4">
        <button type="submit">Send Message</button>
    </form>
  </main>
